0" rx="155" ry="38" class="uc"/><text x="500" y="305.0" class="ucText">Validate Codeforces Handle</text><ellipse cx="1050" cy="300" rx="175" ry="38" class="uc"/><text x="1050" y="294.5" class="ucText">Fetch Public Profile,</text><text x="1050" y="315.5" class="ucText">Submissions and Rating History</text><ellipse cx="1050" cy="425" rx="170" ry="39" class="uc"/><text x="1050" y="430.0" class="ucText">Normalize Submission Data</text><ellipse cx="800" cy="545" rx="180" ry="40" class="mainuc"/><text x="800" y="539.5" class="ucText">Calculate Deterministic</text><text x="800" y="560.5" class="ucText">Performance Metrics</text><ellipse cx="360" cy="690" rx="100" ry="39" class="uc"/><text x="360" y="684.5" class="ucText">Calculate Summary</text><text x="360" y="705.5" class="ucText">Metrics</text><ellipse cx="580" cy="690" rx="100" ry="39" class="uc"/><text x="580" y="684.5" class="ucText">Analyze Topic-wise</text><text x="580" y="705.5" class="ucText">Statistics</text><ellipse cx="800" cy="690" rx="100" ry="39" class="uc"/><text x="800" y="684.5" class="ucText">Analyze Problem</text><text x="800" y="705.5" class="ucText">Rating Distribution</text><ellipse cx="1020" cy="690" rx="100" ry="39" class="uc"/><text x="1020" y="684.5" class="ucText">Analyze Submission</text><text x="1020" y="705.5" class="ucText">Verdicts</text><ellipse cx="1240" cy="690" rx="100" ry="39" class="uc"/><text x="1240" y="684.5" class="ucText">Identify Upsolving</text><text x="1240" y="705.5" class="ucText">Candidates</text><ellipse cx="800" cy="860" rx="200" ry="42" class="mainuc"/><text x="800" y="854.5" class="ucText">Display Charts, Tables</text><text x="800" y="875.5" class="ucText">and Performance Summary</text><ellipse cx="1150" cy="860" rx="180" ry="42" class="erruc"/><text x="1150" y="854.5" class="ucText">Handle Invalid Handles,</text><text x="1150" y="875.5" class="ucText">API Failures and Empty Data</text><line x1="280" y1="975" x2="330" y2="975" class="assoc"/><text x="340" y="980" class